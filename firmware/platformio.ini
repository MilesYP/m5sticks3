; ────────────────────────────────────────────────────────────
; M5StickS3 極客口袋終端 — 正式韌體（firmware/）
; 建置設定照抄 selftest/platformio.ini（已實機驗證 8MB PSRAM 正常）。
; VS Code「Open Folder」開到本資料夾 → 狀態列「→」燒錄。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0
board    = esp32-s3-devkitc-1
framework = arduino

; ── PSRAM / Flash：N8R8 = 8MB Flash(QIO) + 8MB PSRAM(OPI) ──
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

; ── 原生 USB + CDC 序列埠 ──
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_SVC_GAP_APPEARANCE=0x03C2
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

monitor_speed = 115200
; B3.6：Serial Monitor 可打診斷指令——打的字會顯示（echo），按 Enter 才整行送出
monitor_echo    = yes
monitor_filters = send_on_enter, esp32_exception_decoder
monitor_eol     = LF

; M4（11-22）：NimBLE-Arduino 2.5.0（Apache-2.0）＝ BLE 滑鼠；Arduino 2.0.17 編不過時改 1.4.3 並記錄原因。
;   build_flags 的 CONFIG_BT_NIMBLE_SVC_GAP_APPEARANCE=0x03C2＝藍牙 GAP 外觀設成滑鼠（iOS 用）
;   CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192（31-m4b）：預設 4096，配對加密（Secure Connections 的橢圓曲線運算）可能撐爆堆疊
;   monitor_filters 加 esp32_exception_decoder：當機時序列埠直接印出是哪個函式（不用手動解位址）
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
    links2004/WebSockets @ ^2.4.2
    h2zero/NimBLE-Arduino @ 2.5.0
