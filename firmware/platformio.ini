; ────────────────────────────────────────────────────────────
; M5StickS3 極客口袋終端 — 正式韌體（firmware/）
; 建置設定照抄 selftest/platformio.ini（已實機驗證 8MB PSRAM 正常）。
; VS Code「Open Folder」開到本資料夾 → 狀態列「→」燒錄。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0
board    = esp32-s3-devkitc-1
framework = arduino

; ── PSRAM / Flash：N8R8 = 8MB Flash(QIO) + 8MB PSRAM(OPI) ──
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

; ── 原生 USB + CDC 序列埠 ──
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
