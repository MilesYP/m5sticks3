; ────────────────────────────────────────────────────────────
; ble-mouse-ref — M4-0 對照用最小藍牙滑鼠（Bluedroid）
; 目的：同一塊板子、同一台 Mac，換一套藍牙軟體（Arduino 核心內建 Bluedroid
;       ＋BLEHIDDevice，不是 NimBLE），判斷 Mac「配對完就 unused 斷線」
;       是我們 NimBLE 實作的問題，還是 macOS 這一側的問題。
; 不加任何新函式庫（M5Unified／M5GFX 與 firmware 同版本）。
; 燒錄前主韌體先打 q0 進 root（關 PM1 看門狗，見 CLAUDE.md 鐵則十一第 3 點）。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0
board    = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
