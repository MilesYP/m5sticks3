; ────────────────────────────────────────────────────────────
; M5StickS3 + RF Pack S3 — 階段四 RF 探針 (Stage 4 RF Probe)  —  PlatformIO 設定
; 獨立的驗收測試專案，與 selftest/、日後的 firmware/ 分開。
; 板子設定與 selftest 完全相同（已在階段二實機驗證可用）。
; v1~v4 用手寫 SPI 讀寫 CC1101，時序在這塊板子上不穩定；
; v5 起改用正式韌體也要用的 SmartRC 函式庫（與 Bruce 相同）做驗收。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0          ; 與 selftest 相同
board    = esp32-s3-devkitc-1          ; 以 ESP32-S3 通用板為基底
framework = arduino

; ── PSRAM / Flash：N8R8 = 8MB Flash(QIO) + 8MB PSRAM(OPI) ──
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

; ── 原生 USB + CDC 序列埠 ──
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; ── 函式庫：M5 與 selftest 相同（git tag 鎖 0.3.0）──
; v5 起加入 SmartRC-CC1101-Driver-Lib（Bruce 使用的 bmorcelli 分支），
; 用 commit hash 鎖定版本（2025-08-18），確保日後重編結果一致。
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib.git#7bba5217dc0632f718a3278dc27e401016741a95
