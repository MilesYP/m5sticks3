[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../firmware/src

monitor_speed = 115200

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0

[env:m5sticks3-rmt5]
extends = env:m5sticks3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
build_flags =
    ${env:m5sticks3.build_flags}
    -DIR_TEST_RMT5
