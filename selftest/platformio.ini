; ────────────────────────────────────────────────────────────
; M5StickS3 硬體自檢 (Stage 2 Self-Test)  —  PlatformIO 設定
; 這是獨立的驗收測試專案，與日後的正式韌體專案分開。
; 板子到貨後：VS Code 開啟本資料夾 → 按下方狀態列的「→」燒錄。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0          ; 官方 StickS3 範例指定的版本
board    = esp32-s3-devkitc-1          ; 以 ESP32-S3 通用板為基底
framework = arduino

; ── PSRAM / Flash：N8R8 = 8MB Flash(QIO) + 8MB PSRAM(OPI, 八線) ──
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

; ── 原生 USB + CDC 序列埠（這支自檢用 USB-CDC 印訊息）──
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; ── 函式庫：用 git tag 鎖死 0.3.0，避免 registry 延遲或日後版本漂移 ──
; M5Unified 0.3.0 已內建 M5PM1 電源晶片驅動，不需另外加。
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
