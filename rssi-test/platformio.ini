; ────────────────────────────────────────────────────────────
; M5StickS3 + RF Pack S3 — CC1101 接收驗收 v6（RSSI 測試）— PlatformIO 設定
; 獨立專案，與 acceptance-test/（v5，SPI 讀寫）分開，v5 保持原樣可重跑。
; 板子與函式庫設定與 acceptance-test/ 完全相同（已實機驗證）。
; 注意：espressif32@6.12.0 = Arduino 2.0.17 / ESP-IDF 4.4，
;       SmartRC 驅動的 checkMISO() 等待在此版本有效（IDF 5 以上會被編譯掉）。
; ─────────────────────────────────────────────────────────────
[env:m5sticks3]
platform = espressif32@6.12.0
board    = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib.git#7bba5217dc0632f718a3278dc27e401016741a95
