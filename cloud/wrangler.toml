# StickS3 中控 — Cloudflare Worker + Durable Object
name = "sticks3-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 裝置的 WebSocket 連線都交給這個 Durable Object（有狀態、可存對話、支援休眠）
[[durable_objects.bindings]]
name = "VOICE"
class_name = "VoiceSession"

# 免費方案的 Durable Object 需用 SQLite 後端
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceSession"]

# A5-2：每 30 分鐘更新資訊頁雲端資料（天氣、快訊；Costs 每 3 小時）並推給連著的裝置
[triggers]
crons = ["*/30 * * * *"]

# 每日額度（台北日期；一般變數不是 secret）：超過就不開 OpenAI session，回 {"t":"error","code":"quota"}
# A5-2 起以美金為主：DAILY_MAX_USD；DAILY_MAX_TURNS 只是防程式出錯一直重開的保險。echo 模式不計。改完要重新 deploy。
[vars]
DAILY_MAX_USD = "2"
DAILY_MAX_TURNS = "200"
# 價格（11-20 查 developers.openai.com；官方改價時改這裡）：gpt-live-1 每分鐘、web search 每次、後端 gpt-5.6-luna 每百萬 token
LIVE_USD_PER_MIN = "0.05"
SEARCH_USD = "0.01"
BACKEND_IN_USD_PER_M = "0.2"
BACKEND_CACHED_USD_PER_M = "0.02"
BACKEND_OUT_USD_PER_M = "1.2"
# 帳上餘額＝CREDIT_USD（CREDIT_SINCE 那天 00:00 UTC 起的儲值總額）− Costs API 到昨天的花費 − 中控記的今天花費
# 儲值後改 CREDIT_USD（加上新儲值的金額）再 deploy。CREDIT_USD 留空＝不顯示餘額。
CREDIT_USD = "10"
CREDIT_SINCE = "2026-11-16"
# 11-21 校正餘額：有設 BALANCE_USD 時，餘額＝BALANCE_USD − 這次校正之後中控記的花費（不再用 Costs API 推算，
# Costs API 只到昨天、而且只算得到這台中控記的帳，跟 platform 會有落差）。
# 要重新校正：去 platform.openai.com 看餘額，改 BALANCE_USD，並把 BALANCE_SET 改成新的時間（換了才會從 0 重新累計）再 deploy。
# 兩個都留空＝回到原本 CREDIT_USD 算法。
BALANCE_USD = "4.14"
BALANCE_SET = "2026-11-21T16:14+08:00"
# 快訊來源（逗號分隔的 RSS 網址；中央社）
NEWS_FEEDS = "https://feeds.feedburner.com/rsscna/politics,https://feeds.feedburner.com/rsscna/intworld,https://feeds.feedburner.com/rsscna/finance,https://feeds.feedburner.com/rsscna/technology,https://feeds.feedburner.com/rsscna/lifehealth,https://feeds.feedburner.com/rsscna/social"
# 回覆音量：GPT 聲音固定放大倍數（11-20 實聽：2.5 較大聲但更爆，1 比較清楚）。暫調：npx wrangler deploy --var OUT_GAIN:3
OUT_GAIN = "1"
# 聲音（API 清單見 docs/M1B-架構.md；ChatGPT App 的 Ember 不在 API 裡）：meridian＝英語北美口音男聲
GPT_VOICE = "meridian"
