<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>StickS3 中控測試</title>
<style>
body{font:15px system-ui,"PingFang TC",sans-serif;max-width:640px;margin:32px auto;padding:0 16px;color:#15202a}
input,button{font:15px inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc}
button{cursor:pointer;background:#2f7de1;color:#fff;border:0}
button.sec{background:#eee;color:#111}
#log{margin-top:16px;background:#0d1218;color:#e6ecf2;border-radius:10px;padding:12px;height:360px;overflow:auto;white-space:pre-wrap;font:13px ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.state{font-weight:700}
</style></head>
<body>
<h1>StickS3 中控 B1 測試</h1>
<p>用來不靠板子就測中控的 WebSocket。填入 Worker 的 wss 網址（部署後會印出，結尾加 <code>/ws</code>）。</p>
<div class="row">
  <input id="url" style="flex:1;min-width:280px" placeholder="wss://sticks3-hub.你的子網域.workers.dev/ws">
  <button id="conn">連線</button>
  <button id="disc" class="sec">斷線</button>
</div>
<div class="row">
  <button id="start">長按 A（start）</button>
  <button id="stop" class="sec">放開 A（stop）</button>
  <button id="hist" class="sec">看對話紀錄</button>
  <button id="ping" class="sec">ping</button>
</div>
<div class="row">目前狀態：<span id="st" class="state">—</span></div>
<div id="log"></div>
<script>
let ws=null;
const $=id=>document.getElementById(id);
function log(s,c){const d=document.createElement('div');if(c)d.style.color=c;d.textContent=s;$('log').appendChild(d);$('log').scrollTop=1e9;}
$('conn').onclick=()=>{
  const u=$('url').value.trim(); if(!u){log('請先填網址','#ff8');return;}
  ws=new WebSocket(u);
  ws.onopen=()=>log('● 已連線 '+u,'#7fdca0');
  ws.onclose=()=>log('○ 已斷線','#ff9');
  ws.onerror=e=>log('✕ 錯誤（網址對嗎？要 wss:// 開頭、/ws 結尾）','#f88');
  ws.onmessage=e=>{
    log('← '+e.data);
    try{const m=JSON.parse(e.data); if(m.t==='state'){$('st').textContent=m.v;}}catch{}
  };
};
$('disc').onclick=()=>{if(ws)ws.close();};
function send(o){if(!ws||ws.readyState!==1){log('尚未連線','#ff8');return;}ws.send(JSON.stringify(o));log('→ '+JSON.stringify(o),'#9cf');}
$('start').onclick=()=>send({t:'start'});
$('stop').onclick=()=>send({t:'stop'});
$('hist').onclick=()=>send({t:'history'});
$('ping').onclick=()=>send({t:'ping'});
</script>
</body></html>
